name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test + build + handshake smoke
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Source unit tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Built Node regressions
        run: bun run test:node

      - name: MCP stdio handshake smoke (docs/demo-handshake.mjs)
        env:
          # Dummy, non-secret values. loadEnv() only checks these are non-empty
          # at process startup — no network call happens before the handshake's
          # initialize/tools/list responses come back, so no real E*TRADE
          # credentials are needed to exercise the handshake.
          ETRADE_ENV: prod
          ETRADE_ALLOW_ORDERS: "0"
          ETRADE_LOAD_DOTENV: "0"
          ETRADE_PROD_API_KEY: ci-smoke-dummy-key
          ETRADE_PROD_API_SECRET: ci-smoke-dummy-secret
        run: node docs/demo-handshake.mjs node dist/mcp.js
